<!doctype html>
<!-- The link-preview card (web/public/og.jpg). To make it, open /scripts/og-card.html on the dev
     server in a 1200×630 viewport. Then save a screenshot as web/public/og.jpg. -->
<meta charset="utf-8" /><link rel="stylesheet" href="/src/styles/base.css" />
<style>
  html,
  body {
    margin: 0;
    width: 1200px;
    height: 630px;
    overflow: hidden;
  }
  body {
    background: var(--paper);
  }
  .card {
    position: relative;
    width: 1200px;
    height: 630px;
  }
  .left {
    position: absolute;
    left: 76px;
    top: 0;
    bottom: 120px;
    width: 680px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 26px;
  }
  .brand img {
    width: 128px;
    height: 128px;
  }
  .brand h1 {
    margin: 0;
    font-size: 118px;
    font-weight: 600;
    line-height: 1;
    letter-spacing: -0.01em;
  }
  .say {
    margin: 26px 0 0;
    font-size: 23px;
    letter-spacing: 0.06em;
  }
  .about {
    margin: 36px 0 0;
    font-size: 40px;
    line-height: 1.25;
    white-space: nowrap;
  }
  .url {
    position: absolute;
    left: 76px;
    bottom: 62px;
    font-size: 22px;
    letter-spacing: 0.1em;
    padding: 3px 10px;
    background: var(--ink);
    color: var(--paper);
  }
  canvas.art {
    position: absolute;
    right: 0;
    top: 0;
    border-left: 3px solid var(--ink);
  }
</style>
<div class="card">
  <div class="left">
    <div class="brand">
      <img src="/src/assets/mark.svg" alt="" />
      <h1>bauplan</h1>
    </div>
    <p class="about">A puzzle game of cellular automata.</p>
  </div>
  <span class="url">ZKINGSTON.COM/BAUPLAN</span>
  <canvas class="art"></canvas>
</div>
<script type="module">
  import { drawPiece, drawObstacle, prepare } from '/src/components/board.ts';
  const C = 105,
    cols = 4,
    rows = 6;
  const c = document.querySelector('canvas.art');
  const { ctx, dpr } = prepare(c, cols * C, rows * C);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const B = '--blue',
    R = '--red',
    Y = '--yellow',
    K = '--ink';
  // Each entry: [x, y, size in tiles, shape, color, direction]. Shapes: 0 S, 1 Q, 2 T, 3 L, 4 C, 5 D,
  // 6 H, 7 W, and -1 is an obstacle.
  const art = [
    [0, 0, 1, 4, B, 0],
    [1, 0, 1, 1, R, 1],
    [2, 0, 2, 1, Y, 0],
    [0, 1, 1, 2, Y, 2],
    [1, 1, 1, 6, B, 1],
    [0, 2, 2, 4, R, 0],
    [2, 2, 1, -1],
    [3, 2, 1, 3, B, 1],
    [2, 3, 1, 7, K, 0],
    [3, 3, 1, 1, Y, 2],
    [0, 4, 1, 3, Y, 0],
    [1, 4, 1, 5, B, 0],
    [2, 4, 2, 1, B, 3],
    [0, 5, 1, -1],
    [1, 5, 1, 2, R, 1],
  ];
  for (const [x, y, k, s, col, f] of art)
    if (s < 0) drawObstacle(ctx, x * C, y * C, C);
    else drawPiece(ctx, x * C, y * C, k * C, { s, c: 0, f }, col);
  ctx.globalCompositeOperation = 'multiply';
  ctx.globalAlpha = 0.7;
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--line');
  for (let x = 1; x < cols; x++) ctx.fillRect(x * C, 0, 1, rows * C);
  for (let y = 1; y < rows; y++) ctx.fillRect(0, y * C, cols * C, 1);
  document.body.dataset.ready = '1';
</script>
